name: Update Forge Docker image
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read latest stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/quer3q/ps5-dump-forge/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check published version
        id: check
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          rebuild=true
          if docker pull "$IMAGE:latest"; then
            old_version=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE:latest")
            old_revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:latest")
            if [[ "$old_version" == "$VERSION" && "$old_revision" == "$GITHUB_SHA" ]]; then
              rebuild=false
            fi
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
      - name: Build and smoke test
        if: steps.check.outputs.rebuild == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker build --build-arg FORGE_VERSION="$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" .
          mkdir -p "$RUNNER_TEMP/forge-config" "$RUNNER_TEMP/forge-games"
          chmod 777 "$RUNNER_TEMP/forge-config" "$RUNNER_TEMP/forge-games"
          docker run -d --name forge-test -p 127.0.0.1:18095:8095 \
            -v "$RUNNER_TEMP/forge-config:/config" \
            -v "$RUNNER_TEMP/forge-games:/games" "$IMAGE:latest"
          trap 'docker logs forge-test; docker rm -f forge-test' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS \
            http://127.0.0.1:18095/api/session > session.json
          jq -e --arg v "$VERSION" '.version == $v' session.json
          curl -fsS http://127.0.0.1:18095/ | grep -q 'assets/'
          curl -fsS -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:18095/api/list_dir | jq -e '.entries | any(.path == "/games")'
          docker stop forge-test
      - name: Publish verified image
        if: steps.check.outputs.rebuild == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
